apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-monitor
  annotations:
    kubernetes.io/change-cause: "Release __TAG__"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: equipment-monitor
  template:
    metadata:
      labels:
        app: equipment-monitor
    spec:
      containers:
      - name: equipment-monitor
        image: ayushsksksk/equipment-monitor:__TAG__
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: equipment-monitor-service
spec:
  type: NodePort
  selector:
    app: equipment-monitor
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30041
